<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1522"/>
      <stop offset="100%" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="sl-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56ccf2"/>
      <stop offset="100%" stop-color="#22a7f0"/>
    </linearGradient>
  </defs>

  <!-- Dark broadcast banner canvas -->
  <rect width="960" height="280" rx="28" fill="url(#card-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: SL Viewfinder Monogram (scaled cleanly from 512x512 -> 192x192 at x=64, y=44) -->
  <g transform="translate(64, 44) scale(0.375)">
    <g fill="none" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M 76 148 V 76 H 148" stroke="#f1f5f9"/>
      <path d="M 364 76 H 436 V 148" stroke="url(#sl-cyan)"/>
      <path d="M 76 364 V 436 H 148" stroke="url(#sl-cyan)"/>
      <path d="M 364 436 H 436 V 364" stroke="#f1f5f9"/>
    </g>
    <path
      d="M 114 114 H 242 V 218 L 210 194 V 146 H 146 V 206 L 242 276 V 398 H 114 V 294 L 146 318 V 366 H 210 V 294 L 114 224 Z"
      fill="#f1f5f9"
    />
    <path
      d="M 270 114 H 302 V 366 H 398 V 398 H 270 Z"
      fill="url(#sl-cyan)"
    />
    <g fill="none" stroke="#f1f5f9" stroke-width="11" stroke-linecap="butt">
      <path d="M 366 218 L 394 246"/>
      <path d="M 394 260 L 366 288"/>
      <path d="M 352 288 L 324 260"/>
      <path d="M 324 246 L 352 218"/>
    </g>
    <circle cx="394" cy="118" r="14" fill="#ef4444"/>
  </g>

  <!-- Right: Wordmark & Tagline -->
  <text
    x="294"
    y="150"
    fill="#f8fafc"
    font-family="'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="82"
    font-weight="700"
    letter-spacing="-1.5"
  >Stage<tspan fill="url(#sl-cyan)">Lock</tspan></text>

  <text
    x="298"
    y="196"
    fill="#94a3b8"
    font-family="'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="20"
    font-weight="600"
    letter-spacing="4.2"
  >AI PTZ TRACKING &amp; BROADCAST STUDIO</text>
</svg>
