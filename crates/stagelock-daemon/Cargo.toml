[package]
name = "stagelock-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gst-native = ["stagelock-media/gst-native"]
onnx = ["stagelock-vision/onnx"]
onnx-cuda = ["stagelock-vision/onnx-cuda"]
onnx-directml = ["stagelock-vision/onnx-directml"]
onnx-coreml = ["stagelock-vision/onnx-coreml"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
rosc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
stagelock-core = { path = "../stagelock-core" }
stagelock-integrations = { path = "../stagelock-integrations" }
stagelock-media = { path = "../stagelock-media" }
stagelock-ptz = { path = "../stagelock-ptz" }
stagelock-tracking = { path = "../stagelock-tracking" }
stagelock-vision = { path = "../stagelock-vision" }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
