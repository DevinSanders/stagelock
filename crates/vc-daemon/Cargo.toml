gst-native = ["vc-media/gst-native"]
onnx = ["vc-vision/onnx"]
onnx-cuda = ["vc-vision/onnx-cuda"]
onnx-directml = ["vc-vision/onnx-directml"]
onnx-coreml = ["vc-vision/onnx-coreml"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
rosc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
vc-core = { path = "../vc-core" }
vc-integrations = { path = "../vc-integrations" }
vc-media = { path = "../vc-media" }
vc-ptz = { path = "../vc-ptz" }
vc-tracking = { path = "../vc-tracking" }
vc-vision = { path = "../vc-vision" }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.19"
tower = { version = "0.5", features = ["util"] }
