[package]
name = "stagelock-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "StageLock — AI PTZ Tracking & Broadcast Studio (Tauri 2)"

[features]
default = []
gst-native = ["stagelock-daemon/gst-native"]
onnx = ["stagelock-daemon/onnx"]
onnx-cuda = ["stagelock-daemon/onnx-cuda"]
onnx-directml = ["stagelock-daemon/onnx-directml"]
onnx-coreml = ["stagelock-daemon/onnx-coreml"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
stagelock-daemon = { path = "../../../crates/stagelock-daemon" }
