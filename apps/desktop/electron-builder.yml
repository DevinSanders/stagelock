appId: io.videocontroller.studio
productName: VideoController
copyright: Copyright © 2026 VideoController Contributors (MIT OR Apache-2.0)

asar: true
npmRebuild: false

directories:
  output: release

files:
  - dist/**/*
  - electron/**/*
  - package.json

extraResources:
  - from: dist
    to: web
  - from: ../../docs/ndi-attribution.md
    to: docs/ndi-attribution.md
  - from: ../../LICENSE-MIT
    to: docs/LICENSE-MIT
  - from: ../../LICENSE-APACHE
    to: docs/LICENSE-APACHE
  - from: ../../integrations/companion-module/dist
    to: companion-module/dist
  - from: ../../integrations/companion-module/companion
    to: companion-module/companion
  - from: ../../integrations/companion-module/package.json
    to: companion-module/package.json

win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  extraResources:
    - from: ../../target/release/vc-daemon.exe
      to: bin/vc-daemon.exe

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VideoController
  artifactName: "${productName}-Setup-${version}-win-${arch}.${ext}"

portable:
  artifactName: "${productName}-Portable-${version}-win-${arch}.${ext}"

mac:
  category: public.app-category.video
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  target:
    - dmg
  extraResources:
    - from: ../../target/release/vc-daemon
      to: bin/vc-daemon

linux:
  category: AudioVideo
  maintainer: VideoController Contributors
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  target:
    - AppImage
    - deb
  extraResources:
    - from: ../../target/release/vc-daemon
      to: bin/vc-daemon
