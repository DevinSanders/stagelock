version: 2

# Consolidate all Cargo, pnpm/npm, and GitHub Actions updates into a single weekly PR.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1

updates:
  # Rust workspace crates (root Cargo.toml covers all workspace members).
  - package-ecosystem: "cargo"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"

  # Frontend Tauri 2 + React UI and Bitfocus Companion module (pnpm workspace).
  # Root "/" alone resolves all pnpm-workspace.yaml packages without duplicate PRs.
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"

  # Pinned versions of GitHub Actions in workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"
