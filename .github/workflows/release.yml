name: Release Installers

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            package_cmd: pnpm package:win
            artifact_glob: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - os: macos-latest
            platform: mac
            package_cmd: pnpm package:mac
            artifact_glob: |
              target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            platform: linux
            package_cmd: pnpm package:linux
            artifact_glob: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              release-extras/*.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux WebKitGTK / Tauri 2 system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install & build UI + Companion module
        run: |
          pnpm install --frozen-lockfile
          pnpm build:ui
          pnpm --filter companion-module-stagelock build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Rust workspace tests
        run: cargo test --all-targets

      - name: Package ${{ matrix.platform }} installer via Tauri 2
        run: ${{ matrix.package_cmd }}

      - name: Archive Bitfocus Companion module (Linux runner)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release-extras
          tar -czf release-extras/stagelock-companion-module-${{ github.ref_name }}.tar.gz \
            -C integrations/companion-module dist companion package.json

      - name: Upload ${{ matrix.platform }} release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stagelock-${{ matrix.platform }}-installers
          if-no-files-found: error
          path: |
            ${{ matrix.artifact_glob }}

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all platform installers
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Generate categorized release notes (with direct-commit fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -vxF "${GITHUB_REF_NAME}" | head -n 1 || true)

          # Generate PR-categorized release notes using .github/release.yml
          GEN_ARGS=(-f "tag_name=${GITHUB_REF_NAME}")
          if [ -n "${PREV_TAG}" ]; then
            GEN_ARGS+=(-f "previous_tag_name=${PREV_TAG}")
          fi
          NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${GEN_ARGS[@]}" --jq '.body' || true)

          # Fall back to summarizing direct commits on main when no merged PR bullets exist
          if ! printf '%s\n' "${NOTES}" | grep -qE '^(\*|-) '; then
            if [ -n "${PREV_TAG}" ]; then
              COMMITS=$(git log --no-merges --pretty=format:"* %s (%h)" "${PREV_TAG}..${GITHUB_REF_NAME}" | head -n 50)
            else
              COMMITS=$(git log --no-merges --pretty=format:"* %s (%h)" "${GITHUB_REF_NAME}" | head -n 50)
            fi
            {
              echo "## What's Changed"
              echo ""
              echo "${COMMITS}"
              if [ -n "${NOTES}" ]; then
                echo ""
                echo "${NOTES}"
              fi
            } > release-notes.md
          else
            printf '%s\n' "${NOTES}" > release-notes.md
          fi

      - name: Publish GitHub Release for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          ASSETS=(dist-artifacts/**/*)
          FILES=()
          for f in "${ASSETS[@]}"; do
            if [ -f "$f" ]; then
              FILES+=("$f")
            fi
          done
          EXTRA_FLAGS=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
            "${EXTRA_FLAGS[@]}" \
            --title "StageLock ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
