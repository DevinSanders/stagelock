name: Release Bundles

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build vc-daemon (release)
        run: cargo build --release -p vc-daemon

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build UI + Companion module
        run: |
          pnpm install --frozen-lockfile
          pnpm build:ui
          pnpm --filter companion-module-videocontroller build

      - name: Upload vc-daemon + PWA + Companion artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videocontroller-${{ matrix.os }}
          path: |
            target/release/vc-daemon*
            apps/desktop/dist/
            integrations/companion-module/dist/
            integrations/companion-module/companion/
            integrations/companion-module/package.json
            LICENSE-APACHE
            LICENSE-MIT
            docs/ndi-attribution.md
