name: Release Installers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            package_cmd: pnpm package:win
            artifact_glob: apps/desktop/release/*.exe
          - os: macos-latest
            platform: mac
            package_cmd: pnpm package:mac
            artifact_glob: apps/desktop/release/*.dmg
          - os: ubuntu-latest
            platform: linux
            package_cmd: pnpm package:linux
            artifact_glob: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build vc-daemon (release)
        run: cargo build --release -p vc-daemon

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build UI + Companion module
        run: |
          pnpm install --frozen-lockfile
          pnpm build:ui
          pnpm --filter companion-module-videocontroller build

      - name: Package ${{ matrix.platform }} installer via electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ${{ matrix.package_cmd }}

      - name: Upload ${{ matrix.platform }} installers & Companion module
        uses: actions/upload-artifact@v4
        with:
          name: videocontroller-${{ matrix.platform }}-installers
          path: |
            ${{ matrix.artifact_glob }}
            integrations/companion-module/dist/
            integrations/companion-module/companion/
            integrations/companion-module/package.json
            LICENSE-APACHE
            LICENSE-MIT
            docs/ndi-attribution.md
