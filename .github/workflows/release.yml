name: Release Installers

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            package_cmd: pnpm package:win
            artifact_glob: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - os: macos-latest
            platform: mac
            package_cmd: pnpm package:mac
            artifact_glob: |
              target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            platform: linux
            package_cmd: pnpm package:linux
            artifact_glob: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              release-extras/*.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKitGTK / Tauri 2 system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install & build UI + Companion module
        run: |
          pnpm install --frozen-lockfile
          pnpm build:ui
          pnpm --filter companion-module-stagelock build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Rust workspace tests
        run: cargo test --all-targets

      - name: Package ${{ matrix.platform }} installer via Tauri 2
        run: ${{ matrix.package_cmd }}

      - name: Archive Bitfocus Companion module (Linux runner)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release-extras
          tar -czf release-extras/stagelock-companion-module-${{ github.ref_name }}.tar.gz \
            -C integrations/companion-module dist companion package.json

      - name: Upload ${{ matrix.platform }} release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stagelock-${{ matrix.platform }}-installers
          if-no-files-found: error
          path: |
            ${{ matrix.artifact_glob }}

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Publish GitHub Release for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          ASSETS=(dist-artifacts/**/*)
          FILES=()
          for f in "${ASSETS[@]}"; do
            if [ -f "$f" ]; then
              FILES+=("$f")
            fi
          done
          EXTRA_FLAGS=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
            "${EXTRA_FLAGS[@]}" \
            --title "StageLock ${GITHUB_REF_NAME}" \
            --generate-notes
