name: CI (Windows / macOS / Linux)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-and-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKitGTK / Tauri 2 system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS/TS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend user-perspective UI tests & >=90% coverage gate
        run: pnpm test:ui:coverage

      - name: Typecheck & build Desktop + Mobile PWA UI
        run: pnpm build:ui

      - name: Build Bitfocus Companion / Buttons module
        run: pnpm --filter companion-module-stagelock build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Rust workspace unit & integration tests
        run: cargo test --all-targets

      - name: Check Tauri 2 desktop binary
        run: cargo check -p stagelock-desktop

      - name: Build optimized standalone stagelock-daemon release binary
        run: cargo build --release -p stagelock-daemon
