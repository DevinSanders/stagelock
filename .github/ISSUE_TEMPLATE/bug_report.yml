name: Bug report
description: Report a bug, crash, tracking issue, or camera protocol problem in StageLock
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch StageLock
        2. Add camera (NDI / RTSP / ONVIF / USB / DeckLink)
        3. Enable Auto Tracking / perform action...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: GPU, GStreamer / NDI Runtime & Camera / PTZ Model
      placeholder: "e.g. RTX 4070, GStreamer 1.28, NDI 6 Runtime, PTZOptics Move 4K (VISCA TCP)"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      render: shell
