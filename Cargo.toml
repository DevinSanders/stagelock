[workspace]
resolver = "2"
members = [
    "crates/stagelock-core",
    "crates/stagelock-media",
    "crates/stagelock-ptz",
    "crates/stagelock-vision",
    "crates/stagelock-tracking",
    "crates/stagelock-integrations",
    "crates/stagelock-daemon",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.23"
bytes = "1.9"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0"
futures-util = "0.3"
libloading = "0.9"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-tls", "json"] }
rosc = "0.11"
roxmltree = "0.20"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tokio = { version = "1.44", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
